# A股短线动量/打板分析系统 配置文件

capital:
  total: 3000          # 总本金（元）

# 交易成本（虚拟盘计入，保证验证数据真实——3k资金每笔几乎都触发最低佣金，
# 一轮买卖约11元≈1500元仓位的0.73%，不计成本会系统性高估收益）
trading_costs:
  commission_rate: 0.00025   # 佣金万2.5
  commission_min: 5.0        # 单笔最低5元
  stamp_duty: 0.0005         # 印花税万5（仅卖出）

risk:
  max_position_pct: 0.50     # 单票最大仓位占比（约1500元）
  max_stocks: 2              # 同日最多持仓股票数
  stop_loss_pct: -0.05       # 硬止损 -5%
  max_gap_up_pct: 0.07       # 高开超过7%不追
  min_gap_pct: -0.02         # 低开超过-2%剔除
  consecutive_loss_pause: 3  # 连续亏损3笔强制空仓1个交易日
  min_price: 2.0             # 最低股价（过滤仙股）
  max_price: 30.0            # ⚠️ 已被仓位上限实质覆盖：单票≤50%本金(1500元)意味着
                             #   一手 affordable 的股价上限=15元。此参数仅作二次兜底，
                             #   调整单票可买价格请改 max_position_pct，改这里不生效。

strategy:
  top_gainers_pages: 4        # 每页100只，按涨幅拉取前400只做分析
  min_turnover_rate: 5.0      # 候选股最低换手率%（主板档）
  max_turnover_rate: 25.0     # 候选股最高换手率%（主板档；过高说明分歧大）
  wide_turnover_factor: 1.6   # 20cm/30cm板块（创业板/科创板/北交所）换手上限放大系数
  max_candidates: 5           # 晚间输出候选池上限
  final_picks: 2              # 早间最终作战计划股票数上限
  sentiment_threshold: 0     # 市场总开关：昨日涨停股今日平均涨幅低于此值(%)则整体空仓
  promotion_rate_min: 0.15   # 晋级率总开关：昨日涨停今日再涨停比例低于15%（接力退潮）则整体空仓
  slippage_pct: 0.003        # 虚拟盘买入滑点0.3%：竞价价是虚拟撮合价，
                             # 真实成交在09:30后市价，强势股往往快速上冲

# 历史事件回测（py src/main.py backtest，本地/云端均可跑）
backtest:
  workers: 6                # K线并发拉取线程数（新浪主源；腾讯备源时建议调低防WAF）
  max_events_per_day: 2     # 每日模拟事件上限（对应实盘 max_stocks）

# ---------- 低频三策略（换战场：ETF趋势/行业轮动/小市值轮动） ----------
# 打板八年回测全负后转向的低频战场：不抢速度、摩擦占比低、机器不与散户抢。
# 三个策略各一本虚拟账本（books），回测+4周虚拟验证后按表现集中资金。
books:                       # 三本虚拟账本（py src/main.py lowfreq 每晚维护）
  trend:    {capital: 1000, costs: etf_free}    # S1：免五口径（回测双场景的基准列）
  rotation: {capital: 1000, costs: etf_free}
  smallcap: {capital: 1000, costs: stock_std}   # S3：股票成本（含印花税）
lowfreq:
  trend:                       # S1 指数ETF趋势跟随（宽基/黄金分散趋势来源）
    universe: [510300, 510500, 159915, 512100, 510880, 518880]
    ma_window: 20             # 趋势均线（回测网格对比 20/60）
    ma_confirm: 1              # MA需上行的确认天数
    mom_window: 20             # 动量窗口（回测网格对比 20/60/120）
    slippage: 0.001            # ±0.1%滑点（ETF点差）
  rotation:                    # S2 行业ETF轮动
    universe: [512690, 512010, 512480, 512660, 512000, 512800, 515030, 515790,
               512400, 515220, 159928, 159825, 515000, 515880, 512720, 512200,
               512170, 516010, 512760, 515210, 512580, 159611]
    rebalance_days: 20         # 调仓间隔（回测对比 5周频/20/60月频）
    mom_window: 20             # 动量排名窗口
    top_n: 2                    # 持有前2名
    min_mom: 0.0               # 最强者动量也<0时空仓持币
    slippage: 0.001
  smallcap:                    # S3 小市值轮动（回测偏差最重，只作方向参考）
    top_n: 5
    min_list_days: 365         # 剔除次新
    min_price: 2.0
    slippage: 0.003            # 小票滑点与打板同口径
  costs:                       # 回测双成本场景：免五与否对3k月频轮动是分水岭
    etf_std:  {commission_rate: 0.00025, commission_min: 5.0, stamp_duty: 0}   # 普通券商
    etf_free: {commission_rate: 0.0005,  commission_min: 0.0, stamp_duty: 0}   # ETF免五
    stock_std: {commission_rate: 0.00025, commission_min: 5.0, stamp_duty: 0.0005}

# ---------- 打板降级：纯虚拟盘（对照组） ----------
# 八年回测全负后停止打板实盘跟进：morning/afternoon 不再推送可执行指令，
# 晚间复盘保留（情绪温度计：晋级率/涨停均涨幅 + 虚拟盘对照组数据）。
paband:
  virtual_only: true

notify:
  # ⚠️ 出于安全考虑，SendKey 不写入本文件（会随git推送到云端造成泄露）。
  # 本地使用：先执行  set SERVERCHAN_KEY=你的SendKey  再运行程序；
  # 云端使用：配置 GitHub Secrets 的 SERVERCHAN_KEY（见 README）。
  serverchan_key: ""
  # 推送渠道: serverchan / console / both
  channel: "both"

schedule_note: "云端GitHub Actions: 北京时间 19:10 收盘复盘（含龙虎榜）+ 低频三账本 / 09:32 开盘确认 / 14:45 尾卖提醒（virtual_only时跳过）"
