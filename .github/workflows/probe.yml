name: 数据源探针
# 一次性诊断工具：从 Actions(Azure IP) 实测回测数据源连通性，用事实选源
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 探测数据源
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python - <<'EOF'
          import time, requests
          from concurrent.futures import ThreadPoolExecutor

          # 确定存在的大盘股代码（避免把退市代码误判为网络失败）
          VALID = ["sh600000", "sh600009", "sh600016", "sh600019", "sh600028",
                   "sh600029", "sh600030", "sh600031", "sh600036", "sh600048",
                   "sh600050", "sh600089", "sh600104", "sh600196", "sh600519",
                   "sz000001", "sz000002", "sz000063", "sz000333", "sz000651"]

          def probe_sina(n=10, workers=6):
              """新浪getKLineData：回测主源（单请求全历史）"""
              def one(sym):
                  try:
                      r = requests.get(
                          "https://money.finance.sina.com.cn/quotes_service/api/"
                          "json_v2.php/CN_MarketData.getKLineData",
                          params={"symbol": sym, "scale": "240", "ma": "no",
                                  "datalen": "2000"},
                          timeout=(5, 15))
                      rows = r.json() or []
                      return 1 if len(rows) > 1000 else 0
                  except Exception:
                      return 0
              t0 = time.time()
              with ThreadPoolExecutor(max_workers=workers) as ex:
                  oks = list(ex.map(one, VALID[:n]))
              dt = time.time() - t0
              print(f"[Sina {workers}线程] {sum(oks)}/{n} ok, {dt:.1f}s, "
                    f"吞吐 {n/dt:.1f} 只/秒 -> 5400只约 {5400/(n/dt)/60:.0f} 分钟")

          def probe_tencent_serial(n=20):
              ok = fail = 0
              t0 = time.time()
              for sym in VALID[:n]:
                  try:
                      r = requests.get(
                          "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get",
                          params={"param": f"{sym},day,2025-01-01,2025-03-01,10,"},
                          timeout=(5, 10))
                      d = (r.json().get("data") or {}).get(sym) or {}
                      ok += 1 if d.get("day") else 0
                  except Exception:
                      fail += 1
              dt = time.time() - t0
              print(f"[Tencent serial] {ok}/{n} ok, {dt:.1f}s, avg {dt/n:.2f}s/req")

          def probe_ltb():
              """东财datacenter龙虎榜（evening打分依赖）+ push2his指数日K（日期推断依赖）"""
              try:
                  r = requests.get(
                      "https://datacenter-web.eastmoney.com/api/data/v1/get",
                      params={"reportName": "RPT_DAILYBILLBOARD_DETAILSNEW",
                              "columns": "ALL",
                              "filter": "(TRADE_DATE='2026-09-04')",
                              "sortColumns": "BILLBOARD_NET_AMT", "sortTypes": "-1",
                              "pageSize": 5, "pageNumber": 1},
                      timeout=(5, 15))
                  js = r.json()
                  rows = ((js.get("result") or {}).get("data")) or []
                  print(f"[datacenter LTB] ok, 榜单{len(rows)}条, "
                        f"top={rows[0]['SECURITY_NAME_ABBR']} "
                        f"净买{rows[0]['BILLBOARD_NET_AMT']/1e8:.2f}亿" if rows
                        else f"[datacenter LTB] HTTP通但无数据: {js.get('success')}")
              except Exception as e:
                  print(f"[datacenter LTB] 失败: {e}")
              try:
                  r = requests.get(
                      "https://push2his.eastmoney.com/api/qt/stock/kline/get",
                      params={"secid": "1.000300", "fields1": "f1",
                              "fields2": "f51", "klt": 101, "fqt": 1,
                              "end": "20500101", "lmt": 3},
                      timeout=(5, 10))
                  ks = (r.json().get("data") or {}).get("klines") or []
                  print(f"[push2his 指数日K] ok, 最近交易日: "
                        f"{[k.split(',')[0] for k in ks]}")
              except Exception as e:
                  print(f"[push2his 指数日K] 失败: {e}")

          probe_sina()
          probe_tencent_serial()
          probe_ltb()
          EOF
