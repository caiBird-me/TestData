name: 每日股票分析
# 北京时间与UTC时差恒定8小时且不跨日错位（北京09:32 = 当日UTC 01:32）
# 北京时间 19:10 收盘复盘（UTC 11:10）/ 09:32 开盘确认买入（UTC 01:32）/ 14:45 尾卖提醒（UTC 06:45）
# SendKey 通过 GitHub Secrets 的 SERVERCHAN_KEY 注入，绝不写入任何随仓库提交的文件
on:
  schedule:
    - cron: '10 11 * * 1-5'  # 北京 19:10 周一~周五。龙虎榜盘后约17:00-18:30才发布，
                              #   15:10运行永远拿不到当日榜；19:10复盘含当日龙虎榜席位，
                              #   且仍在次日开盘前，人工操作窗口不受影响
    - cron: '32 1 * * 1-5'   # 北京 09:32 周一~周五。09:31分钟K已生成：成交可行性校验与
                              #   滑点修正真正生效（09:27运行时分钟K不存在，校验恒跳过）；
                              #   推送约09:33到达，人工09:35前下单仍在可操作窗口内
    - cron: '45 6 * * 1-5'   # 北京 14:45 周一~周五。收盘前15分钟的尾卖提醒——
                              #   T+1卖出指令在15:10收盘后推送则人工无法执行
  workflow_dispatch:          # 支持手动触发（选 morning/evening/afternoon/lowfreq/backtest）
    inputs:
      job:
        description: '运行哪个任务'
        required: true
        default: 'evening'
        type: choice
        options:
          - evening
          - morning
          - afternoon
          - lowfreq
          - stats
          - backtest
      mode:
        description: '回测类型（仅backtest用：etf/smallcap，留空为打板paband）'
        required: false
        default: ''
      start_year:
        description: '回测起始年（仅backtest用，默认2019）'
        required: false
        default: ''
      end_year:
        description: '回测结束年（仅backtest用，默认今年）'
        required: false
        default: ''

permissions:
  contents: write             # 允许把运行数据 commit 回仓库

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  evening:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'evening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 收盘复盘
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py evening

      - name: 低频虚拟盘（三账本）
        # 换战场后的主战场：ETF趋势/行业轮动/小市值三本虚拟账本，
        # 每晚补账（今日开盘价×滑点）+ 登记明晚信号 + 净值入账
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py lowfreq

      - name: 提交运行数据
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: evening $(date -u +%F)"
          git push

  morning:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'morning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 竞价确认
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py morning

      - name: 提交运行数据
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: morning $(date -u +%F)"
          git push

  afternoon:
    # 尾卖提醒（14:45）：只推送不改账，记账统一在15:10 evening（用收盘价）
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'afternoon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 尾盘提醒
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py afternoon

  lowfreq:
    # 手动触发低频虚拟盘（正常由 evening job 每晚自动带跑）
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'lowfreq'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 低频虚拟盘
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py lowfreq

      - name: 提交运行数据
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: lowfreq $(date -u +%F)"
          git pull --rebase origin develop || true
          git push

  stats:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 统计报告
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py stats

  backtest:
    # 全市场日K扫描（~5400只，新浪源单请求全历史，6并发约20-40分钟）
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 历史回测
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # Python stdout块缓冲曾让60分钟运行的日志全被吞掉（杀进程时缓冲区丢弃）
          # ——排障时完全黑盒，强制行缓冲让日志实时可见
          PYTHONUNBUFFERED: 1
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.mode }}" ] && ARGS="$ARGS ${{ github.event.inputs.mode }}"
          [ -n "${{ github.event.inputs.start_year }}" ] && ARGS="$ARGS ${{ github.event.inputs.start_year }}"
          [ -n "${{ github.event.inputs.end_year }}" ] && ARGS="$ARGS ${{ github.event.inputs.end_year }}"
          python src/main.py backtest $ARGS

      - name: 提交回测摘要
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest/report*.json
          git diff --cached --quiet || git commit -m "data: backtest $(date -u +%F)"
          # 回测跑40分钟期间远端可能有新提交（如代码热修），先rebase再推，撞车不失败
          git pull --rebase origin develop || true
          git push
