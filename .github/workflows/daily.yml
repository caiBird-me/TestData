name: 每日股票分析
# 北京时间与UTC时差恒定8小时且不跨日错位（北京09:20 = 当日UTC 01:20）
# 北京时间 15:10 收盘复盘（UTC 07:10）/ 09:20 竞价确认（UTC 01:20）
# SendKey 通过 GitHub Secrets 的 SERVERCHAN_KEY 注入，绝不写入任何随仓库提交的文件
on:
  schedule:
    - cron: '10 7 * * 1-5'   # 北京 15:10 周一~周五
    - cron: '27 1 * * 1-5'   # 北京 09:27 周一~周五（竞价已定09:25、开盘前，买入价为确定的竞价成交价，
                              #   避开09:20-09:25撤单高发窗口的虚价）
  workflow_dispatch:          # 支持手动触发（选 morning/evening/backtest）
    inputs:
      job:
        description: '运行哪个任务'
        required: true
        default: 'evening'
        type: choice
        options:
          - evening
          - morning
          - stats
          - backtest
      start_year:
        description: '回测起始年（仅backtest用，默认2019）'
        required: false
        default: ''
      end_year:
        description: '回测结束年（仅backtest用，默认今年）'
        required: false
        default: ''

permissions:
  contents: write             # 允许把运行数据 commit 回仓库

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  evening:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'evening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 收盘复盘
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py evening

      - name: 提交运行数据
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: evening $(date -u +%F)"
          git push

  morning:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'morning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 竞价确认
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py morning

      - name: 提交运行数据
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: morning $(date -u +%F)"
          git push

  stats:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 统计报告
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py stats

  backtest:
    # 全市场日K扫描（~5400只，10-20分钟），必须在云端跑——本地网络 push2his 不通
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 历史回测
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.start_year }}" ] && ARGS="$ARGS ${{ github.event.inputs.start_year }}"
          [ -n "${{ github.event.inputs.end_year }}" ] && ARGS="$ARGS ${{ github.event.inputs.end_year }}"
          python src/main.py backtest $ARGS

      - name: 提交回测摘要
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest/report.json
          git diff --cached --quiet || git commit -m "data: backtest $(date -u +%F)"
          # 回测跑40分钟期间远端可能有新提交（如代码热修），先rebase再推，撞车不失败
          git pull --rebase origin develop || true
          git push
